<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zebethweb - Admin BIOS</title>
    <link rel="stylesheet" href="estilos_admin.css">
</head>
<body>
<div class="main-container">
    <div class="right-panel"> 
        <h2 class="panel-title"></h2>
        <div id="lista-juegos" class="db-grid"></div>
    </div>

    <div class="left-panel"> 
        <h2 class="panel-title">Add New Entry</h2>
        <div class="form-container">
            <div class="input-group">
                <label>Title:</label>
                <input type="text" id="nombre" placeholder="Game Title">
            </div>
            <div class="input-group">
                <label>ID:</label>
                <input type="text" id="id_serial" placeholder="Serial ID">
            </div>
            <div class="input-group">
                <label>Format:</label>
                <input type="text" id="formato" placeholder="Format (ISO, NKIT, GCZ)">
            </div>
            <div class="input-group">
                <label>URL:</label>
                <input type="text" id="link_descarga" placeholder="Download Link">
            </div>
            
            <div class="action-zone">
                <p>Add this game to database?</p>
                <div class="button-row">
                    <button id="btnGuardar" class="btn-confirm">YES</button>
                    <button id="btnLimpiar" class="btn-cancel">NO</button>
                </div>

<div class="info-display">
    <div id="info-text">Select a game</div>
</div>

<!-- 1. MODAL DE DETALLE (Independiente) -->
<div class="modal-overlay" id="modalDetalle" style="display: none;">
    <div class="modal-content">
<div class="modal-left" style="position: relative; display: flex; align-items: center; justify-content: center; margin-right: 40px; min-width: 300px;">
    <img id="modalImagen" src="" alt="Portada" style="width: 100%; border-radius: 10px; border: 3px solid #fff;">
    
    <!-- El disco ahora se posiciona un poco más hacia adentro de la portada -->
    <div style="position: absolute; width: 65%; right: -30px; bottom: -10px; z-index: 2;">
        <img id="modalDisco" src="" alt="Disco" style="border-radius: 50%; width: 100%; filter: drop-shadow(0 0 15px rgba(0,0,0,0.9));">
    </div>
</div>

        <div class="modal-right">
            <div class="info-header">EDITAR ENTRADA</div>
            <div class="info-body">
                <label>Nombre del Juego:</label>
                <input type="text" id="editNombre" class="input-gc">
                <label>ID / Serial:</label>
                <input type="text" id="editID" class="input-gc">
                <label>Formato:</label>
                <input type="text" id="editFormato" class="input-gc">
                <label>URL de Descarga/Info:</label>
                <input type="text" id="editURL" class="input-gc">
                <p>Subido el: <span id="modalFecha"></span></p>
            </div>
<div class="modal-actions">
    <button class="btn-gc btn-gc-a" id="btnActualizarModal">
        <span>(A)</span> ACTUALIZAR
    </button>
    
    <button class="btn-gc btn-gc-b" id="btnBorrarDesdeModal">
        <span>(B)</span> BORRAR
    </button>

    <button class="btn-gc btn-gc-x" id="btnCerrarModal" style="background: #0080ff;">
        <span>(X)</span> CERRAR
    </button>
</div>
        </div>
    </div>
</div>

    
    
<!-- 2. MODALES DE SISTEMA (FUERA DE TODO, AL FINAL) -->

<div id="confirmModal" class="confirm-overlay" style="display: none; z-index: 9999;">
    <div class="confirm-box">
        <div class="confirm-content">
            <p id="confirmMessage">The data will be deleted.<br>Continue?</p>
            <div class="confirm-options">
                <div id="optionYes" class="option-item"><span class="selection-arrow">▶</span> YES</div>
                <div id="optionNo" class="option-item selected"><span class="selection-arrow">▶</span> NO</div>
            </div>
        </div>
    </div>
</div>  

<div id="successModal" class="confirm-overlay" style="display: none; z-index: 9999;">
    <div class="confirm-box" style="background: linear-gradient(135deg, #00008b 0%, #1e90ff 100%);">
        <div class="confirm-content">
            <p>SUCCESS:<br>Data has been written.</p>
            <div class="confirm-options">
                <div id="btnOk" class="option-item selected"><span class="selection-arrow">▶</span> OK</div>
            </div>
        </div>
    </div>
</div>

<div id="warningModal" class="confirm-overlay" style="display: none; z-index: 9999;">
    <div class="confirm-box" style="background: linear-gradient(135deg, #cc7a00 0%, #663d00 100%);">
        <div class="confirm-content">
            <p>⚠️ WARNING:<br>All slots must be filled!</p>
            <div class="confirm-options">
                <div id="btnOkWarning" class="option-item selected"><span class="selection-arrow">▶</span> OK</div>
            </div>
        </div>
    </div>
</div>

<script type="module" src="script_admin.js"></script>
</body>
</html>

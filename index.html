<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameCube Backup</title>
    <link rel="stylesheet" href="styles.css" />
    <meta property="og:type" content="website">
<meta property="og:title" content="Gamecube Backup">
<meta property="og:description" content="Un backup de mis juegos de gamecube">
<meta property="og:image" content="https://github.com/Zebeth055/Zebethweb/blob/main/Assets/icons/gamecube%20icono.svg">
<meta property="og:url" content="https://zebeth055.github.io/Zebethweb/">
<meta property="theme-color" content="#5814e4">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Gamecube Backup">
<meta name="twitter:description" content="Un backup de mis juegos de gamecube.">
<meta name="twitter:image" content="https://github.com/Zebeth055/Zebethweb/blob/a99e1657613c2d679b12f81df1664701b85bd3db/Social%20preview.jpg">
    </head>

    
<body> 
    <div id="intro-screen">
        <div id="gc-lid">
            <div id="jewel-container"></div>
        </div>

        <video id="gamecube-intro" playsinline preload="auto">
            <source src="Assets/intro.mp4" type="video/mp4" />
            Tu navegador no soporta videos.
        </video>

        <div class="power-interface">
            <div class="curved-text-wrapper">
                <svg viewBox="0 0 100 40" xmlns="http://www.w3.org/2000/svg">
                    <path id="power-curve" d="M 10,35 A 40,40 0 0 1 90,35" fill="transparent" />
                    <text>
                        <textPath xlink:href="#power-curve" startOffset="50%" text-anchor="middle">
                            POWER
                        </textPath>
                    </text>
                </svg>
            </div>
            <button id="start-btn"></button>
            <div id="power-led"></div>
        </div>
    </div>

    <audio id="startup-jingle" preload="auto"><source src="sounds/Startup.mp3" type="audio/mpeg" /></audio>
    <audio id="sound-select-1" src="./sounds/Option Move 1.mp3" preload="auto"></audio>
    <audio id="sound-select-2" src="./sounds/Option Move 2.mp3" preload="auto"></audio>
    <audio id="sound-select-3" src="./sounds/Option Move 3.mp3" preload="auto"></audio>
    <audio id="sound-error" src="./sounds/Error.mp3" preload="auto"></audio>
    <audio id="sound-next" src="./sounds/Menu Back.mp3" preload="auto"></audio>
    <audio id="sound-prev" src="./sounds/Menu Select.mp3" preload="auto"></audio>
    <audio id="bg-music" loop preload="auto"><source src="sounds/Nintendo GameCube Menu.mp3" type="audio/mpeg" /></audio>

    <header>
        <div class="header-title" onclick="reproducirSonidoAleatorio()" style="cursor: pointer;">
    <img src="Assets/icons/gamecube icono.svg" class="header-icon" alt="icon">
</div>
<div class="container-acciones">
        <button class="Tools-retro" onclick="window.open('dolphin-emu.org/')">
            <img src="Assets/icons/Dolphin icon.svg" class="btn-custom-icon" alt="icon"> 
        </button>
        <button class="Tools-retro" onclick="abrirModalRetro('modalDolphin')">
            <img src="Assets/icons/gear.svg" class="btn-custom-icon" alt="icon"> 
        </button>
    </div>
        
        
<div class="controles-orden">
    <div class="select-wrapper" style="display: flex; align-items: center; gap: 15px;">
        <select id="selectOrden" class="estilo-retro">
            <option value="az">A - Z</option>
            <option value="za">Z - A</option>
            <option value="peso">Peso</option>
        </select>

    </div>
</div>
        <div class="search-container">
            <input type="text" id="inputBuscador" placeholder="[ BUSCAR_DATOS ]">
        </div>
        <div class="gc-volume-wrapper">
            <span class="gc-volume-label">VOL.</span>
            <input type="range" id="master-volume" min="0" max="1" step="0.05" value="0.5">
        </div>
        <div class="admin-header-zone">
    <button id="btn-admin-login" class="gc-btn-mini"><span class="btn-icon-admin"></span> ADMIN</button>
    <div id="admin-menu-wrapper" class="admin-dropdown-wrapper">
            <img src="Assets/pfp/guest/guest_168.png" class="admin-avatar" style="filter: grayscale(0.5);" alt="Guest">
            <button class="dropdown-trigger-retro" id="trigger-login-retro" style="padding-right: 15px; --after-content: none;">
                LOGIN
            </button>
        </div></div>
        
        
    </header>

    <main>
        <div id="grid-container" class="grid-container"></div>

        <div class="gcn-front-panel">
            <div class="control-ports" id="container-puertos"></div>
            <div class="memory-slots">
                <button id="prev-page" class="mem-card-slot">
                    <span>Atras</span>
                    <div class="slot-line"></div>
                </button>
                <button id="next-page" class="mem-card-slot">
                    <span>Siguiente</span>
                    <div class="slot-line"></div>
                </button>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="modalDetalle">
        <div class="modal-content">
            <div class="modal-left" style="position: relative; display: flex; align-items: center; justify-content: center">
                <img id="modalImagen" src="" alt="Portada" />
                <div style="position: absolute; width: 65%; right: -25px; bottom: -15px; z-index: 2">
                    <img id="modalDisco" src="" alt="Disco" />
                </div>
            </div>
            <div class="modal-right">
                <h2 id="modalTitulo" class="info-header">TITULO</h2>
                <div class="info-body">
                    ID: <span id="modalID" style="color: var(--btn-a)"></span><br />
                    FORMATO: <span id="modalFormato" style="color: #fff"></span><br />
                    COMPRESIÓN: <span id="modalCompresion" style="color: #fff"></span><br />
                </div>
                <div class="modal-actions">
                    <button class="btn-gc btn-gc-a" id="btn-descargar"><span>(A)</span> CONTINUAR</button>
                    <button class="btn-gc btn-gc-b" onclick="cerrarModal()"><span>(B)</span> ATRÁS</button>
                </div>
            </div>
        </div>
    </div>

    <div id="modalLogin" class="modal-base">
        <div class="modal-contenido-retro">
            <h2 class="modal-titulo-retro">ADMIN ACCESS</h2>
            <div class="modal-cuerpo-retro">
                <div class="input-group-retro">
                    <label>USER_ID:</label>
                    <input type="email" id="loginEmail" placeholder="example@mail.com" />
                </div>
                <div class="input-group-retro">
                    <label>ACCESS_CODE:</label>
                    <input type="password" id="loginPass" placeholder="••••••••" />
                </div>
            </div>
            <div class="modal-footer-retro">
                <button id="btn-cancel-login" class="btn-gc-retro b"><span class="btn-icon b">B</span> CANCEL</button>
                <button id="btn-confirm-login" class="btn-gc-retro a"><span class="btn-icon a">A</span> CONFIRM</button>
            </div>
        </div>
    </div>

<div id="modalDolphin" class="modal-base">
    <div class="modal-contenido-retro dolphin-style">
        <h2 class="modal-titulo-retro">TOOLS</h2>
        
        <div class="modal-cuerpo-retro">
            <p class="modal-text-retro"></p>
            
            <div class="grid-herramientas-dolphin">
<button class="btn-tool-dolphin" onclick="window.location.href = 'Tools/GCT Maker.html'">
    <img src="Assets/icons/config.png" class="tool-icon-img" alt="Config">
    GCT Maker
</button>
                <button class="btn-tool-dolphin" onclick="window.open('URL_HERRAMIENTA_4', '_blank')">
                    <img src="Assets/icons/textures.png" class="tool-icon-img" alt="Texturas">
                    TEXTURAS
                </button>
            </div>
        </div>

        <div class="modal-footer-retro">
            <button class="btn-gc-retro b" onclick="window.cerrarModalDolphin()">
                <span class="btn-icon b">B</span> CANCEL
            </button>
        </div>
    </div>
</div>

    
    <div id="modalAlert" class="modal-base">
        <div class="modal-contenido-retro alert-style">
            <h2 id="alertTitle" class="modal-titulo-retro">SYSTEM ERROR</h2>
            <p id="alertMessage" class="modal-text-retro">DESCRIPTION</p>
            <div class="modal-footer-retro">
                <button id="btn-close-alert" class="btn-gc-retro a"><span class="btn-icon a">A</span> OK</button>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
    <script src="secret/pikmins.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GameCube BIOS - Card Manager Mode</title>
    <style>
        :root {
            --gc-blue-panel: linear-gradient(180deg, #2a2a8e 0%, #15154d 50%, #000033 100%);
            --gc-dark: #000000;
            --gc-grid: rgba(255, 255, 255, 0.15);
            --btn-a: #00ffcc; 
            --btn-b: #ff3366; 
            --font-main: 'Arial Rounded MT Bold', 'Helvetica', sans-serif;
            --glow-blue: 0 0 10px rgba(65, 105, 225, 0.8), 0 0 20px rgba(0, 0, 139, 0.6);
        }

        body { 
            margin: 0; 
            font-family: var(--font-main);
            background-color: var(--gc-dark);
            background-image: 
                radial-gradient(circle, transparent 0%, rgba(0,0,0,1) 90%),
                linear-gradient(var(--gc-grid) 2px, transparent 2px),
                linear-gradient(90deg, var(--gc-grid) 2px, transparent 2px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            background-attachment: fixed;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- HEADER & GRID --- */
        header { 
            background: var(--gc-blue-panel);
            margin: 20px;
            padding: 18px 35px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            position: sticky; top: 20px; z-index: 100;
        }

        .header-title {
            font-size: 1.4rem;
            text-transform: uppercase;
            font-weight: bold;
            text-shadow: 0 0 10px #fff, var(--glow-blue);
        }

        .search-container {
            background: rgba(0, 0, 0, 0.4);
            border: 3px solid #000;
            border-radius: 8px;
            padding: 8px 20px;
        }

        .search-container input {
            background: transparent; border: none; color: var(--btn-a);
            outline: none; font-family: monospace; font-size: 1rem;
        }

        #grid-container { 
            padding: 40px 20px 120px; 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(210px, 240px)); 
            gap: 40px; justify-content: center;
        }

        .tarjeta { 
            position: relative;
            background-color: #fff; border: 4px solid #000;
            border-radius: 10px; overflow: hidden; 
            transition: transform 0.4s ease-out;
            aspect-ratio: 1 / 1.3;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.5);
            cursor: pointer;
        }

        .tarjeta:hover { transform: translateY(-6px); border-color: var(--btn-a); }
        .tarjeta img { width: 100%; height: 100%; object-fit: cover; }

        .tarjeta-info {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: linear-gradient(90deg, #2a2a8e 0%, #4169e1 100%);
            border-top: 3px solid #fff; padding: 12px 0;
            text-align: center; font-size: 0.9rem; text-transform: uppercase;
            text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
        }

        /* --- VENTANA MODAL (EL DETALLE) --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none; /* Oculto por defecto */
            justify-content: center; align-items: center;
            z-index: 1000;
            backdrop-filter: blur(8px);
        }

        .modal-content {
            background: rgba(10, 10, 30, 0.9);
            width: 80%; max-width: 900px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 20px;
            padding: 40px;
            display: flex; gap: 40px;
            box-shadow: 0 0 50px rgba(0,0,0,1), inset 0 0 20px rgba(65, 105, 225, 0.3);
            position: relative;
            animation: modalSlide 0.3s ease-out;
        }

        @keyframes modalSlide {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-left { flex: 1; text-align: center; }
        .modal-left img { 
            width: 100%; border-radius: 10px; 
            border: 4px solid #fff; 
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .modal-right { 
            flex: 1.5; 
            background: rgba(255,255,255,0.05); 
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 25px;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        .info-header {
            font-size: 1.8rem; color: var(--btn-a);
            margin-bottom: 15px; border-bottom: 2px solid var(--btn-a);
            padding-bottom: 10px;
        }

        .info-body { font-family: monospace; font-size: 1.1rem; line-height: 1.6; }
        .info-status { color: #aaa; margin-top: 20px; font-style: italic; }

        .modal-actions {
            margin-top: 30px; display: flex; gap: 20px;
        }

        /* --- BOTONES ESTILO GAME PAD --- */
        .btn-gc {
            padding: 12px 25px; border-radius: 50px; border: 3px solid #000;
            font-weight: bold; cursor: pointer; text-transform: uppercase;
            display: flex; align-items: center; gap: 10px;
        }
        .btn-gc-a { background: var(--btn-a); color: #000; }
        .btn-gc-b { background: var(--btn-b); color: #fff; }

        /* --- FOOTER --- */
        .footer-guide {
            position: fixed; bottom: 0; width: 100%;
            background: rgba(0,0,0,0.9); padding: 15px 0;
            display: flex; justify-content: center; gap: 60px;
            border-top: 2px solid #333; z-index: 100;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">MEMORY CARD MANAGER</div>
        <div class="search-container">
            <input type="text" id="inputBuscador" placeholder="[ BUSCAR_DATOS ]">
        </div>
    </header>

    <div id="grid-container"></div>

    <div class="modal-overlay" id="modalDetalle">
        <div class="modal-content">
            <div class="modal-left">
                <img id="modalImagen" src="" alt="Portada">
            </div>
            <div class="modal-right">
                <div>
                    <div class="info-header" id="modalTitulo">TITULO</div>
                    <div class="info-body">
                        ID: <span style="color:var(--btn-a)">DOL-P-GMSE</span><br>
                        BLOQUES: 15 / 251<br>
                        ESTADO: <span style="color:#00ff00">ARCHIVO OK</span><br>
                        FECHA: 28/04/2026
                    </div>
                    <div class="info-status">"Los datos guardados en la Memory Card han sido verificados para Nintendo GameCube."</div>
                </div>
                <div class="modal-actions">
                    <button class="btn-gc btn-gc-a" onclick="cerrarModal()"><span>(A)</span> CONTINUAR</button>
                    <button class="btn-gc btn-gc-b" onclick="cerrarModal()"><span>(B)</span> ATRÁS</button>
                </div>
            </div>
        </div>
    </div>

    <div class="footer-guide">
        <div style="color:var(--btn-a)"> (A) DETALLES</div>
        <div style="color:var(--btn-b)"> (B) SALIR</div>
    </div>

    <script>
    const productos = [
        { nombre: "Metroid Prime", imagen: "https://metroiddatabase.com/wp-content/uploads/2017/07/16403-metroid-prime-gamecube-front-cover.jpg" },
        { nombre: "Zelda: Wind Waker", imagen: "https://m.media-amazon.com/images/I/516RE7767ML.jpg" },
        { nombre: "Luigi's Mansion", imagen: "https://m.media-amazon.com/images/I/51H65K6S5BL.jpg" },
        { nombre: "F-Zero GX", imagen: "https://m.media-amazon.com/images/I/51S6Z8R05EL.jpg" }
    ];

    const container = document.getElementById('grid-container');
    const modal = document.getElementById('modalDetalle');

    function inicializarGrid() {
        container.innerHTML = "";
        productos.forEach(p => {
            const card = document.createElement('div');
            card.className = 'tarjeta';
            card.onclick = () => abrirModal(p);
            card.innerHTML = `
                <img src="${p.imagen}">
                <div class="tarjeta-info">${p.nombre}</div>
            `;
            container.appendChild(card);
        });
    }

    function abrirModal(item) {
        document.getElementById('modalTitulo').innerText = item.nombre;
        document.getElementById('modalImagen').src = item.imagen;
        modal.style.display = "flex";
    }

    function cerrarModal() {
        modal.style.display = "none";
    }

    // Cerrar con tecla B (Esc)
    window.addEventListener('keydown', (e) => {
        if (e.key === "Escape" || e.key === "b" || e.key === "B") cerrarModal();
    });

    inicializarGrid();
    </script>
</body>
</html>

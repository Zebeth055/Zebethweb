  <!-- Detecta Android y ajusta efectos -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (/Android/i.test(navigator.userAgent)) {
        document.body.classList.add("no-blur", "no-fixed-bg");
      }
    });
  </script>

<style>
  :root {
    /* Variables para facilitar cambios globales */
    --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    --text-shadow: 0px 0px 10px rgb(0, 0, 1);
    --glass-bg: rgba(185, 205, 255, 0.54);
    --glass-border: rgba(255, 255, 255, 0.8);
    --transition: all 0.5s ease;
  }

  body {
    margin: 0;
    font-family: var(--font-main);
    background: url('https://blogger.googleusercontent.com/img/a/AVvXsEgl2j2JhbaiUXNch-npFIk2fS5PJu3Xzk-h8kKTz0yNFUuocIFVzJEwqh9QrnrqLXHBKkS7b0NS98qm2vSpG5d5uoPWO9k08r5tzK7X3v7Hqu_tQsAju_5SgZZUN0yZ8evD5eVz-SNzdl-LWyBVIXAVrbLN7ePCp4tBv9RgwsataUj81zT1F8xGE-r_gD9L') no-repeat center center fixed;
    background-size: cover;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  /* Modificador para quitar fondo fijo */
  .no-fixed-bg {
    background-attachment: scroll !important;
    background-size: cover;
    background-repeat: repeat;
  }

  /* Banner Principal */
  .banner {
    width: 100%;
    height: 180px;
    filter: blur(2px);
    background: url('https://blogger.googleusercontent.com/img/a/AVvXsEhWhRTla4cO6oaMwTq7Jim3Q3ZrTrzhpqODcD4hF0Iecix-GYNzCOQIdYj6miUAu03DHjIMOvGLW81ME3-UhyBf0GApVedbr1qeqfD2FcI2lDOzJaa1BOBpPgGKMWXbVL3UQImuQbZ1Ok5MU4zJlO1yS2_ExjtVhduirYLon3eCgJ7QFuD5bnH1Fu6rrMKJ') no-repeat center;
    background-size: cover;
  }

  /* Contenido sobre el banner */
  .encima-banner {
    position: absolute;
    top: 0px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    z-index: 10;
  }

  .encima-banner img {
    max-height: 180px;
  }

  .encima-banner span {
    font-size: 20px;
    font-weight: bold;
    color: #000;
  }

  /* Tipografías Comunes */
  .texto-titulo, 
  .texto-piepagina, 
  .texto-visitatmb {
    text-align: center;
    color: white;
    font-weight: bold;
    margin: 20px 0 15px;
    padding: 0 15px;
    text-shadow: var(--text-shadow);
    line-height: 1.2;
  }

  .texto-titulo, .texto-piepagina { font-size: 25px; }
  .texto-visitatmb { font-size: 28px; }

  /* Contenedores de Botones */
  .contenedor-botones {
    margin-top: 40px;
    display: flex;
    flex-direction: column;
    gap: 35px;
  }

  .botones-horizontales {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 20px;
    margin: 20px 0;
  }

  /* Botón Base */
  .boton {
    display: flex;
    align-items: center;
    width: 250px;
    padding: 12px 20px;
    background-color: var(--glass-bg);
    border: 3px solid var(--glass-border);
    border-bottom-width: thick;
    border-radius: 100px;
    backdrop-filter: blur(5px);
    box-shadow: 0 4px 8px rgba(221, 239, 255, 0.2);
    cursor: pointer;
    transition: var(--transition);
    font-size: 22px;
    color: #000;
    font-weight: bold;
    text-decoration: none;
  }

  .boton:hover {
    background-color: #fff;
    transform: translateY(-2px);
  }

  .boton img {
    max-width: 50px;
    max-height: 50px;
    margin-right: 5px; /* Espacio entre imagen y texto */
  }

  .boton span {
    flex-grow: 1;
    text-align: center;
    text-shadow: none;
  }

  /* Variantes de Botón */
  .boton.horizontal {
    width: auto;
    white-space: nowrap;
    gap: 15px;
  }

  .no-blur .boton {
    backdrop-filter: none !important;
  }
</style>
